<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — EduVille</title>
  <meta name="description" content="Reset your EduVille password.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/extra.css">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0d1117 0%, #0F1E4A 100%);
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--r-lg);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      border-radius: var(--r-lg) var(--r-lg) 0 0;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      font-family: var(--font-head);
      font-size: 1.8rem;
      font-weight: 700;
    }
    .auth-logo .gold { color: var(--gold); }
    .auth-tagline {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .auth-back {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-decoration: none;
    }
    .auth-back:hover { color: var(--gold); text-decoration: none; }
    .auth-footer {
      text-align: center;
      color: var(--text-secondary);
      padding: 1.5rem 1rem;
      font-size: 0.8rem;
    }
    .auth-footer p { margin-bottom: 0.3rem; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">

      <a href="login.html" class="auth-back">
        <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
        Back to Login
      </a>

      <div class="auth-logo">
        <span>Edu<span class="gold">Ville</span></span>
      </div>

      <p class="auth-tagline">✨ Commit to Your Future ✨</p>

      <div class="form-msg" id="form-msg" role="status"></div>

      <form class="form-card" id="forgot-form" novalidate style="background:transparent; border:none; padding:0; margin:0;">
        <h2 style="text-align:center;">Reset your password</h2>
        <p class="form-note" style="text-align:center;">
          Enter the email you used to sign up. We'll send you a link to set a new password.
        </p>

        <div class="form-group">
          <label for="fp-email">Email</label>
          <input type="email" id="fp-email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-actions" style="justify-content:center;">
          <button type="submit" class="btn btn-gold" id="fp-submit" style="width:100%;">
            Send reset link
          </button>
        </div>
      </form>

      <p class="form-note" style="text-align:center; margin-top:1.2rem;">
        Remembered it? <a href="login.html">Back to login</a>
      </p>

    </div>
  </div>

  <footer class="auth-footer">
    <p>© 2026 EduVille · Commit to Your Future</p>
    <p>📧 ttaroiwa@gmail.com · 📞 +263 78 727 9982</p>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/reset.js"></script>
</body>
</html>
