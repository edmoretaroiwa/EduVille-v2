<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EduVille</title>
  <meta name="description" content="Sign in to your EduVille account.">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Same auth styles as signup.html */
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #0d1117 0%, #0F1E4A 100%); }
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .auth-card { width: 100%; max-width: 440px; background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--r-lg); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); position: relative; }
    .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--gold), var(--gold-dark)); border-radius: var(--r-lg) var(--r-lg) 0 0; }
    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; font-family: var(--font-head); font-size: 1.8rem; font-weight: 700; }
    .auth-logo .gold { color: var(--gold); }
    .auth-tagline { text-align: center; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
    .auth-tabs { display: flex; background: var(--bg-primary); border-radius: var(--r-sm); padding: 0.3rem; margin-bottom: 1.5rem; border: 1px solid var(--border-default); }
    .auth-tab { flex: 1; padding: 0.7rem; text-align: center; background: transparent; border: none; border-radius: var(--r-xs); font-family: inherit; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all var(--dur-fast) var(--ease); }
    .auth-tab.active { background: var(--accent-green); color: #fff; }
    .auth-form { display: flex; flex-direction: column; gap: 0.3rem; }
    .auth-form label { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-top: 0.8rem; margin-bottom: 0.3rem; }
    .auth-form input { padding: 0.75rem 1rem; border-radius: var(--r-sm); border: 1px solid var(--border-default); background: var(--bg-primary); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; transition: all var(--dur-fast) var(--ease); }
    .auth-form input:focus { outline: none; border-color: var(--edu-blue-light); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15); }
    .auth-submit { margin-top: 1.5rem; padding: 0.9rem; font-size: 1rem; width: 100%; }
    .auth-hint { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1.2rem; }
    .auth-hint a { color: var(--edu-blue-light); font-weight: 600; }
    .auth-hint a:hover { color: var(--gold); text-decoration: underline; }
    .auth-error { display: none; padding: 0.75rem 1rem; background: rgba(218, 54, 51, 0.15); border: 1px solid var(--accent-red); border-radius: var(--r-sm); color: #ff7b72; font-size: 0.85rem; margin-bottom: 1rem; }
    .auth-error.show { display: block; }
    .auth-footer { text-align: center; color: var(--text-secondary); padding: 1.5rem 1rem; font-size: 0.8rem; }
    .auth-footer p { margin-bottom: 0.3rem; }
    .auth-back { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem; text-decoration: none; }
    .auth-back:hover { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">

      <a href="index.html" class="auth-back">
        <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
        Back to Home
      </a>

      <div class="auth-logo">
        <span>Edu<span class="gold">Ville</span></span>
      </div>

      <p class="auth-tagline">✨ Commit to Your Future ✨</p>

      <div class="auth-tabs">
        <button class="auth-tab active">Login</button>
        <a href="signup.html" class="auth-tab">Sign Up</a>
      </div>

      <div class="auth-error" id="error-box"></div>

      <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">

        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" required>

        <button type="submit" class="btn btn-gold auth-submit" id="login-btn">
          Login
        </button>

        <p class="auth-hint">
          New to EduVille? <a href="signup.html">Create an account</a>
        </p>
      </form>

    </div>
  </div>

  <footer class="auth-footer">
    <p>© 2026 EduVille · Commit to Your Future</p>
    <p>📧 ttaroiwa@gmail.com · 📞 +267 78 727 9982</p>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
