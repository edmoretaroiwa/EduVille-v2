  <style>
    .course-header-block {
      background: linear-gradient(135deg, var(--edu-blue-dark), var(--edu-blue));
      border-radius: var(--r-lg);
      padding: 2rem;
      border: 1px solid var(--border-default);
      position: relative;
      overflow: hidden;
    }

    .course-header-block::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.15), transparent 70%);
      pointer-events: none;
    }

    .course-header-content {
      position: relative;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .course-header-emoji {
      font-size: 3rem;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .course-header-text {
      flex: 1;
      min-width: 200px;
    }

    .course-header-text h1 {
      color: #fff;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      margin-bottom: 0.4rem;
    }

    .course-header-text p {
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
    }

    .course-header-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    /* Lesson rows */
    .lesson-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--r-md);
      margin-bottom: 0.6rem;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .lesson-row:hover {
      border-color: var(--gold);
      transform: translateX(4px);
      text-decoration: none;
    }

    .lesson-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1;
      min-width: 0;
    }

    .lesson-num {
      width: 40px;
      height: 40px;
      background: var(--gold);
      color: var(--edu-blue-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .lesson-info {
      min-width: 0;
    }

    .lesson-info h4 {
      color: var(--text-bright);
      font-size: 1rem;
      margin: 0 0 0.2rem 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-info p {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin: 0;
    }

    .lesson-play {
      color: var(--gold);
      font-size: 1.2rem;
      flex-shrink: 0;
    }
  </style>
</head>
